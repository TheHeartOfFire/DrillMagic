name: .NET Tests

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  test:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore DrillMagic.Tests/DrillMagic.Tests.csproj
    - name: Build
      run: dotnet build DrillMagic.Tests/DrillMagic.Tests.csproj --no-restore
    - name: Test
      run: dotnet test DrillMagic.Tests/DrillMagic.Tests.csproj --no-build --verbosity normal
